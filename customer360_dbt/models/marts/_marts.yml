version: 2

models:
  - name: dim_products
    description: "One row per ERP product."
    columns:
      - name: product_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: dim_customers
    description: "One row per ERP customer, including customers who never purchased."
    columns:
      - name: customer_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: is_never_purchased
        description: "True for customers with no orders."
        data_tests:
          - not_null

  - name: dim_date
    description: "One row per calendar day, 2021-01-01 to 2025-12-31."
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null
      - name: date_key
        description: "Integer key in YYYYMMDD format."
        data_tests:
          - unique
          - not_null

  - name: fact_orders
    description: "One row per ERP order. Source of truth for revenue and profit KPIs."
    columns:
      - name: order_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["Completed", "Returned", "Cancelled", "Pending"]
      - name: net_sales
        data_tests:
          - not_null

  - name: fact_order_items
    description: "One row per order line. Line totals do not reconcile with fact_orders for about 8 percent of orders; see is_order_reconciled."
    columns:
      - name: order_item_id
        description: "Surrogate key (md5 over all source columns)."
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: is_order_reconciled
        description: "False when the order's line totals differ from the order header in fact_orders."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true]
                quote: false
              config:
                severity: warn
